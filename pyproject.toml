[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "opencalcs-as1720"
version = "0.1.0"
description = "Clause-traced selected AS 1720.1 timber member strength checks for OpenCalcs."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-EngCalcs-Proprietary"
dependencies = ["jsonschema>=4.22,<5"]

[project.urls]
Repository = "https://github.com/Elandu/EngCalcs-AS1720"
Issues = "https://github.com/Elandu/EngCalcs-AS1720/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.entry-points."opencalcs.plugins"]
as1720 = "opencalcs_as1720.plugin:get_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/opencalcs_as1720"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
